<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="パーティー">
  <title>パーティーゲーム</title>
  <script>
    // LINE の中のブラウザは画面の向きの扱いが特殊で、縦持ちのときに表示が崩れる。
    // アドレスの最後に openExternalBrowser=1 を付けると、LINE がいつものブラウザ（Chrome / Safari）で開き直してくれる。
    (function () {
      if (!/\sLine\//.test(navigator.userAgent)) return;
      if (location.search.indexOf("openExternalBrowser=1") >= 0) return;
      window.pgOpeningOutside = true;
      location.href = location.pathname + location.search + (location.search ? "&" : "?") + "openExternalBrowser=1" + location.hash;
    })();
  </script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0F4C36; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
    #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; background: #0F4C36; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #FFD43B; font: 900 28px "Hiragino Sans", "Yu Gothic", sans-serif; background: #0F4C36; z-index: 2; }
    #bar { width: 60vw; height: 12px; background: rgba(255,255,255,.2); border-radius: 6px; margin-top: 16px; overflow: hidden; }
    #fill { width: 0; height: 100%; background: #FFD43B; }
  </style>
  <!-- オンライン対戦（WebRTC）用。無料の PeerJS サーバーで相手を見つける -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <!-- 部屋に入るためのQRコードを作る -->
  <script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script>
  <script>
    // 中継サーバー（Metered の無料 TURN）。直接つながれない組み合わせ（iPhone と Android など）を中継する。
    // パスワードが空のときは中継なし（直接つながれる組み合わせだけ）。
    (function () {
      var user = "d55f94416517d527fe27465c";
      var pass = "hsutorgrdjrlzph4";
      var servers = [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun.relay.metered.ca:80" }
      ];
      if (pass) {
        ["turn:global.relay.metered.ca:80",
         "turn:global.relay.metered.ca:80?transport=tcp",
         "turn:global.relay.metered.ca:443",
         "turns:global.relay.metered.ca:443?transport=tcp"].forEach(function (u) {
          servers.push({ urls: u, username: user, credential: pass });
        });
      }
      window.pgIceServers = servers;
    })();
  </script>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading">読み込み中… <span id="pct">0%</span><div id="bar"><div id="fill"></div></div></div>
  <script src="Build/b1ef3b06ffe23d8eece1834665caac99.loader.js"></script>
  <script>
    var pct = document.getElementById("pct"), fill = document.getElementById("fill");
    if (window.pgOpeningOutside) {
      document.getElementById("loading").textContent = "ブラウザで開き直しています…";
    } else createUnityInstance(document.getElementById("unity-canvas"), {
      dataUrl: "Build/b38a1ce8df63d2905f9b9436ed34e6ea.data.unityweb",
      frameworkUrl: "Build/b2e434601151decea89651794b3ee5e6.framework.js.unityweb",
      codeUrl: "Build/c5268120e201ba13f23f8e62600b3ca2.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "パーティーゲーム",
      productVersion: "1.0",
      matchWebGLToCanvasSize: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      // 動かなくなったとき、真っ黒のままにせず理由を画面に出す
      showBanner: function (msg, type) {
        if (type !== "error") return;
        var d = document.getElementById("err") || document.createElement("div");
        d.id = "err";
        d.style.cssText = "position:fixed;left:0;right:0;top:0;padding:16px;background:#C0392B;color:#fff;font:700 16px sans-serif;z-index:9;white-space:pre-wrap";
        d.textContent = "エラーが起きました。アプリを閉じて開き直してください。\n" + msg;
        document.body.appendChild(d);
      },
    }, function (p) {
      pct.textContent = Math.round(p * 100) + "%";
      fill.style.width = Math.round(p * 100) + "%";
    }).then(function () {
      document.getElementById("loading").remove();
    }).catch(function (e) {
      pct.textContent = "読み込めませんでした。閉じて開き直してください：" + e;
    });
  </script>
</body>
</html>
